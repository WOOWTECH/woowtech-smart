name: Native parity candidates

# Called explicitly from CI on a selected source commit. No tags, signing credentials,
# app-store submissions, stable update manifests, or production host changes.
on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  WOOWTECH_SKIP_MAC_INSTALL: "1"
  CI: "1"

jobs:
  desktop:
    name: ${{ matrix.brand }} desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        brand: [woowtech, apporo]
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Apply candidate brand
        run: node woowtech/tools/apply-brand.mjs "$PARITY_BRAND"
        env:
          PARITY_BRAND: ${{ matrix.brand }}
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Build unpacked candidate
        run: |
          node woowtech/tools/native-parity.mjs prepare-desktop
          npm run build:desktop -- --dir --publish never --config native-parity-builder.json
      - name: Verify packaged candidate
        run: node woowtech/tools/native-parity.mjs verify-desktop
        env:
          PASEO_DESKTOP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/native-parity/smoke
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-${{ matrix.brand }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/native-parity
            packages/desktop/release
          if-no-files-found: error
          retention-days: 7

  mobile-export:
    name: ${{ matrix.brand }} mobile bundles
    strategy:
      fail-fast: false
      matrix:
        brand: [woowtech, apporo]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: node scripts/npm-retry.mjs ci
      - name: Apply candidate brand
        run: node woowtech/tools/apply-brand.mjs "$PARITY_BRAND"
        env:
          PARITY_BRAND: ${{ matrix.brand }}
      - name: Build shared app dependencies
        run: npm run build:app-deps:clean
      - name: Export iOS and Android separately
        working-directory: packages/app
        run: |
          npx expo export --platform ios --max-workers 2 --output-dir ../../artifacts/native-parity/ios
          npx expo export --platform android --max-workers 2 --output-dir ../../artifacts/native-parity/android
      - name: Verify native bundle contents and identity
        run: node woowtech/tools/native-parity.mjs verify-mobile
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-${{ matrix.brand }}-mobile-bundles-${{ github.sha }}
          path: artifacts/native-parity
          if-no-files-found: error
          retention-days: 7
