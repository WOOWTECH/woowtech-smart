name: Settings Android emulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/app/src/screens/settings/**"
      - "packages/app/src/screens/settings-screen.tsx"
      - "packages/app/src/utils/host-routes.ts"
      - "packages/app/maestro/ci/settings-android.yaml"
      - ".github/workflows/settings-android-emulator.yml"

permissions:
  contents: read

jobs:
  android-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      APP_VARIANT: development
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build:app-deps
      - name: Generate Android project
        working-directory: packages/app
        run: npx expo prebuild --platform android --non-interactive
      - name: Install Maestro
        run: curl -Ls 'https://get.maestro.mobile.dev' | bash
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run settings on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            cd packages/app/android
            ./gradlew installDebug
            cd ../../..
            adb reverse tcp:8081 tcp:8081
            (cd packages/app && npx expo start --dev-client --port 8081 > /tmp/settings-metro.log 2>&1) &
            "$HOME/.maestro/bin/maestro" test --debug-output /tmp/settings-maestro packages/app/maestro/ci/settings-android.yaml
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-android-evidence
          path: |
            /tmp/settings-maestro
            /tmp/settings-metro.log
          if-no-files-found: ignore
