name: Settings mobile emulators

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/app/src/screens/settings/**"
      - "packages/app/src/screens/settings-screen.tsx"
      - "packages/app/src/utils/host-routes.ts"
      - "packages/app/maestro/ci/settings-android.yaml"
      - "packages/app/maestro/ci/settings-ios.yaml"
      - ".github/workflows/settings-android-emulator.yml"

permissions:
  contents: read

jobs:
  android-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      APP_VARIANT: development
      CI: "1"
      ANDROID_AVD_HOME: /tmp/settings-ci-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build:app-deps
      - name: Generate Android project
        working-directory: packages/app
        run: npx expo prebuild --platform android --non-interactive
      - name: Install Maestro
        run: curl -Ls 'https://get.maestro.mobile.dev' | bash
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android system image
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name settings-ci --package "system-images;android-35;google_apis;x86_64" --path "$ANDROID_AVD_HOME/settings-ci.avd"
          test -f "$ANDROID_AVD_HOME/settings-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds
      - name: Boot Android emulator
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          RUNNER_TRACKING_ID=settings-emulator "$ANDROID_HOME/emulator/emulator" -avd settings-ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-metrics > /tmp/settings-emulator.log 2>&1 &
          timeout 300 adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Build and install Android app
        run: (cd packages/app/android && ./gradlew installDebug)
      - name: Test Android settings
        run: |
          adb reverse tcp:8081 tcp:8081
          (cd packages/app && npx expo start --dev-client --port 8081 > /tmp/settings-metro.log 2>&1) &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8081/status && break || sleep 2; done
          curl -fsS --max-time 900 'http://127.0.0.1:8081/index.bundle?platform=android&dev=true&minify=false' -o /dev/null
          "$HOME/.maestro/bin/maestro" test --debug-output /tmp/settings-maestro packages/app/maestro/ci/settings-android.yaml
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-android-evidence
          path: |
            /tmp/settings-maestro
            /tmp/settings-metro.log
            /tmp/settings-emulator.log
          include-hidden-files: true
          if-no-files-found: ignore

  ios-settings:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      APP_VARIANT: development
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:app-deps
      - name: Install Maestro
        run: curl -Ls 'https://get.maestro.mobile.dev' | bash
      - name: Generate iOS project
        working-directory: packages/app
        run: npx expo prebuild --platform ios --non-interactive
      - name: Build and run iOS simulator
        working-directory: packages/app
        run: |
          npx expo start --dev-client --port 8081 > /tmp/settings-ios-metro.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:8081/status && break || sleep 2; done
          curl -fsS --max-time 900 'http://127.0.0.1:8081/index.bundle?platform=ios&dev=true&minify=false' -o /dev/null
          npx expo run:ios --no-bundler
          "$HOME/.maestro/bin/maestro" test --debug-output /tmp/settings-ios-maestro maestro/ci/settings-ios.yaml
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-ios-evidence
          path: |
            /tmp/settings-ios-maestro
            /tmp/settings-ios-metro.log
          include-hidden-files: true
          if-no-files-found: ignore
