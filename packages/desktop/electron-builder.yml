npmRebuild: false
appId: io.woowtech.smart.desktop
productName: woowtech smart
executableName: woowtech smart
# woowtech smart: the Mac app's NSHumanReadableCopyright (Finder's Get Info, the About window)
# and the Windows executable's copyright. Unset, electron-builder writes "Copyright © <year>
# <package.json author>", which is upstream's author. Keep it equal to WOOWTECH_COPYRIGHT in
# src/features/woowtech-about-panel.ts (woowtech/desktop-about.test.mjs checks both).
copyright: "© 2026 WOOW TECH CO., LTD."
# woowtech smart: electron-builder names electron-updater's download cache after the
# package name, and @getpaseo/desktop gives the official Paseo's @getpaseodesktop-updater.
# package.json's desktopName is Paseo's desktop entry; Linux names ours after executableName.
# electron-builder also takes the exe's and the installer's CompanyName, and the publisher in
# Windows' Apps & features, from author.name, and the installer's FileDescription from
# description. In package.json both are still upstream's.
extraMetadata:
  name: io.woowtech.smart.desktop
  desktopName: woowtech smart.desktop
  author:
    name: "WOOW TECH CO., LTD."
    email: woowtech@designsmart.com.tw
  description: woowtech smart desktop app
# woowtech smart: the legacy winCodeSign archive holds macOS symlinks. Unpacking it needs the
# "create symbolic links" privilege, which a normal Windows account does not have, and the build
# stops with exit status 2. This toolset is plain zip files (README §25).
toolsets:
  winCodeSign: "1.1.0"
protocols:
  - name: woowtech smart agent link
    schemes:
      - woowtech-smart
afterPack: ./scripts/after-pack.js
afterSign: ./scripts/after-sign.js
directories:
  output: release
files:
  - dist/**/*
  - "!**/*.map"
  - "!node_modules/@getpaseo/*/src/**"
  - "!node_modules/@getpaseo/**/*.test.*"
  - "!node_modules/@getpaseo/**/*.spec.*"
  # Relay deployment settings are not desktop runtime resources.
  - "!node_modules/@getpaseo/relay/wrangler*.toml"
  - "!node_modules/@getpaseo/server/dist/server/web-ui/**"
  # Workspace packages are symlinked, so anything a dev generates inside them
  # lands in the asar. CI never has these; a local .debug run adds gigabytes.
  - "!node_modules/@getpaseo/*/.debug/**"
  - "!node_modules/@getpaseo/*/.tasks/**"
  - "!node_modules/@getpaseo/*/conversations/**"
  - "!node_modules/@getpaseo/*/test-results/**"
asarUnpack:
  - dist/daemon/node-entrypoint-runner.js
  - node_modules/@getpaseo/server/dist/server/terminal/shell-integration/**/*
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: assets/editor-targets
    to: editor-target-icons
# woowtech smart: installers and update manifests go to a public releases-only
# repo, because the packaged app cannot read releases of the private source repo.
publish:
  provider: github
  owner: WOOWTECH
  repo: woowtech-smart-releases
mac:
  artifactName: "woowtech-smart-${version}-${arch}.${ext}"
  minimumSystemVersion: "13.0.0"
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # woowtech smart: the purpose string macOS shows when the app asks for the microphone
  # (dictation), naming the app instead of Electron's "This app needs access to the
  # microphone". The Chinese ones are the InfoPlist.strings copied below.
  extendInfo:
    NSMicrophoneUsageDescription: "Allow woowtech smart to use the microphone so you can dictate messages to your agents."
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: bin/paseo
      to: bin/woowtech-smart
    - from: assets/icon.png
      to: icon.png
    # woowtech smart: Traditional and Simplified Chinese permission prompts, into the
    # zh_TW.lproj and zh_CN.lproj folders Electron's bundle already has in Resources.
    - from: assets/lproj/zh_TW.lproj
      to: zh_TW.lproj
    - from: assets/lproj/zh_CN.lproj
      to: zh_CN.lproj
  target:
    - dmg
    - zip
linux:
  category: Development
  icon: assets
  artifactName: "woowtech-smart-${version}-${arch}.${ext}"
  maintainer: "WoowTech <woowtech@designsmart.com.tw>"
  vendor: "WoowTech"
  extraResources:
    - from: bin/paseo
      to: bin/paseo
    - from: bin/paseo
      to: bin/woowtech-smart
    # woowtech smart: notification banner and window icon (README §16 桌面通知).
    - from: assets/icon.png
      to: icon.png
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
deb:
  afterInstall: scripts/linux-sandbox/after-install.tpl
rpm:
  afterInstall: scripts/linux-sandbox/after-install.tpl
appImage:
  # A nonempty argument list replaces builder's hardcoded --no-sandbox default.
  executableArgs: ["--class=woowtech smart"]
  # Keep the AppImage filename stable across versions (no ${version}) so
  # electron-updater overwrites the file in place instead of renaming it to a new
  # versioned path. A rename orphans the old binary, breaks desktop shortcuts, and
  # dangles the ~/.local/bin/woowtech-smart CLI symlink, which points at $APPIMAGE. The
  # version stays discoverable via the release tag and the in-app version.
  artifactName: "woowtech-smart-${arch}.${ext}"
win:
  artifactName: "woowtech-smart-Setup-${version}-${arch}.${ext}"
  icon: assets/icon.ico
  # woowtech smart: the hook signs only in the release job (WOOWTECH_SIGN=1), SHA-256 only; other
  # builds stay unsigned (README §25, plan D8). The release job passes publisherName: an unsigned
  # test build that carried it would refuse its own unsigned updates.
  signtoolOptions:
    sign: ./scripts/woowtech-sign-windows.js
    signingHashAlgorithms: ["sha256"]
  # Smart App Control checks every module that loads, so every .dll and .node file goes to the
  # hook too. The hook keeps a signature a file already has (Microsoft's) and signs the rest.
  signExts: [".dll", ".node"]
  extraResources:
    - from: bin/paseo.cmd
      to: bin/paseo.cmd
    - from: bin/paseo.cmd
      to: bin/woowtech-smart.cmd
    # woowtech smart: notification toast icon (README §16 桌面通知).
    - from: assets/icon.png
      to: icon.png
    # woowtech smart: notification-area and window icon, 16–256 px (README §25).
    - from: assets/icon.ico
      to: icon.ico
  # woowtech smart: no Windows zip. electron-updater uses the NSIS installer, and an extracted
  # copy would take the woowtech-smart: scheme, the Start menu link and the toast activator
  # for itself (README §25, plan B5/D17).
  # x64 only (plan D11). This list wins over --x64 on the command line: with a second architecture
  # electron-builder also builds a combined installer of 259 MB and points latest.yml at it.
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
